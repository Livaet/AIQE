version: '3.8'

services:
  aiqe-connector:
    build: .
    container_name: memoq-aiqe-connector
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: ["python", "main.py", "--mode", "api"]

